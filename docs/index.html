<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>browser-codeium</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #101216;
        color: #f6f7f9;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(720px, calc(100vw - 40px));
      }

      h1 {
        font-size: clamp(2rem, 5vw, 4rem);
        margin: 0 0 1rem;
        letter-spacing: 0;
      }

      p {
        color: #c9ced8;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      a {
        color: #8fd7ff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>browser-codeium</h1>
      <p>
        A GitHub Pages IDE that brings Monaco editing, tree-sitter parsing, and
        WebGPU-ready coding assistance to the browser.
      </p>
      <p>
        Repository:
        <a href="https://github.com/baditaflorin/browser-codeium">https://github.com/baditaflorin/browser-codeium</a>
      </p>
      <p>
        Support:
        <a href="https://www.paypal.com/paypalme/florinbadita">https://www.paypal.com/paypalme/florinbadita</a>
      </p>
      <p>Version: 0.1.0 · Commit: initial</p>
    </main>
  </body>
</html>
